[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koml-retrospective-engine"
version = "0.1.0"
description = "Deterministic mission postmortems from explicit local inputs"
requires-python = ">=3.10"

[project.scripts]
kre = "koml_retrospective_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
